[package]
name = "avb-endpointd"
description = "Runs a Linux computer's AVB and Milan entities with PipeWire devices any app plays into or records from: a library for the files apps share with the daemon, and the daemon behind a feature"
version = "0.2.2"
categories = ["network-programming", "multimedia::audio"]
keywords = ["avb", "atdecc", "milan", "pipewire"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
include = ["src/**", "data/**", "Cargo.toml"]

[lints]
workspace = true

[features]
default = []
# The daemon, which runs the entities; for Linux. Without it the crate is
# the configuration, status and meters files that apps read and write.
daemon = [
    "dep:avb-mrp",
    "dep:avb-pipewire",
    "dep:avb-stream",
    "dep:ctrlc",
    "dep:gptp",
    "dep:libc",
    "gptp/std",
    "atdecc/std",
    "avb-net/std",
]

[[bin]]
name = "avb-endpointd"
path = "src/main.rs"
required-features = ["daemon"]

[dependencies]
atdecc = { workspace = true }
avb-net = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
avb-mrp = { workspace = true, features = ["std"], optional = true }
avb-pipewire = { workspace = true, optional = true }
avb-stream = { workspace = true, optional = true }
ctrlc = { version = "3", features = ["termination"], optional = true }
gptp = { workspace = true, optional = true }
libc = { version = "0.2", optional = true }
