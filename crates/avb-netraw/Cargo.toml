[package]
name = "avb-netraw"
description = "A small helper, the only program granted CAP_NET_RAW, that opens raw Ethernet sockets for avb-endpointd and apps' controllers"
version = "0.1.0"
categories = ["network-programming"]
keywords = ["avb", "raw-socket", "capability"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# Not on crates.io: packages build it from the release tag.
publish = false

[lints]
workspace = true

[dependencies]
avb-net = { workspace = true, features = ["std"] }
