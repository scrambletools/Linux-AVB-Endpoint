# Debian and RPM packages, made with nfpm (https://nfpm.goreleaser.com)
# from a tree staged by scripts/dist-install.sh:
#
#   scripts/dist-install.sh target/release stage /usr
#   VERSION=0.3.1 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb
#   VERSION=0.3.1 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p rpm
name: avb-endpointd
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: sound
priority: optional
maintainer: Scramble Tools <https://github.com/scrambletools>
vendor: Scramble Tools
homepage: https://github.com/scrambletools/Linux-AVB-Endpoint
license: MIT OR Apache-2.0
description: |-
  Puts this computer on an AVB or Milan network, for any app
  avb-endpointd runs this computer's AVB entities on a wired interface, as
  the person's avb-endpointd@INTERFACE user unit, so that any app plays to
  and records from the network through PipeWire devices. Any controller
  connects its streams. It takes gPTP from gptpd, and its raw sockets from
  avb-netraw, the one program granted CAP_NET_RAW. A user service runs
  this computer's AVB entities when an app turns one on, and at each
  desktop login after. Starting its link unit turns EEE and PAUSE off on
  the interface, which reconnects once if they were on.

contents:
  - src: ./stage/usr/
    dst: /usr
    type: tree

scripts:
  postinstall: ./packaging/linux/postinstall.sh

overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgcc-s1
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libasound2t64 | libasound2
      - libcap2-bin
      - gptpd
      - pipewire
      - rtkit
      - ethtool
      - iproute2
    recommends:
      - polkitd | policykit-1
  rpm:
    depends:
      - glibc >= 2.39
      - pipewire-libs
      - alsa-lib
      - libcap
      - gptpd
      - pipewire
      - rtkit
      - ethtool
      - iproute
    recommends:
      - polkit

rpm:
  group: System Environment/Daemons
  summary: Puts this computer on an AVB or Milan network, for any app
