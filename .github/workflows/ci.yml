name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The library half, which apps such as triib build on every system.
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # cpal, for avb-stream's audio, builds against ALSA on Linux, and
      # avb-pipewire against PipeWire, through bindgen.
      - name: ALSA and PipeWire headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libpipewire-0.3-dev libclang-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The daemon, for Linux.
      - name: Clippy, the daemon
        if: runner.os == 'Linux'
        run: cargo clippy -p avb-endpointd --features daemon --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Test, the daemon
        if: runner.os == 'Linux'
        run: cargo test -p avb-endpointd --features daemon --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
