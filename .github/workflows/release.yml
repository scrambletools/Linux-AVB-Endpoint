name: Release

# A tag such as avb-endpointd-v0.2.1 builds avb-endpointd's packages, tests
# each in fresh containers, and drafts a GitHub release with them. Running
# the workflow by hand builds and tests the same packages without a
# release.
on:
  push:
    tags: ['avb-endpointd-v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NFPM_VERSION: 2.43.0
  # The gptpd the install tests put in first, from its own release.
  GPTPD_TAG: v0.1.0

jobs:
  linux:
    # Built on Ubuntu 24.04, the oldest system the packages are for, so
    # they run on the newer ones too.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            deb: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      # cpal, for avb-stream's audio, builds against ALSA, and avb-pipewire
      # against PipeWire, through bindgen.
      - name: ALSA and PipeWire headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libpipewire-0.3-dev libclang-dev
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/avb-endpointd/Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "avb-endpointd-v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match avb-endpointd's version $version" >&2
            exit 1
          fi
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/avb-endpointd/PKGBUILD)
          if [ "$pkgver" != "$version" ]; then
            echo "The PKGBUILD's pkgver $pkgver is not avb-endpointd's version $version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked -p avb-endpointd --features daemon -p avb-netraw
      # The packages ask for the glibc nfpm.yaml names; the binaries must
      # need no newer.
      - name: Check that it runs, and the glibc it needs
        run: |
          target/release/avb-endpointd --version
          needed=$(for binary in target/release/avb-endpointd target/release/avb-netraw; do
            objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//'
          done | sort -V | tail -1)
          declared=$(sed -n 's/.*libc6 (>= \([0-9.]*\)).*/\1/p' packaging/nfpm.yaml)
          echo "needs glibc $needed, the packages ask for $declared"
          if [ "$(printf '%s\n' "$needed" "$declared" | sort -V | tail -1)" != "$declared" ]; then
            echo "avb-endpointd needs glibc $needed, newer than the $declared the packages ask for" >&2
            exit 1
          fi
      - name: Stage
        run: scripts/dist-install.sh target/release stage /usr
      - name: Debian and RPM packages
        run: |
          curl -sSLf -o nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_$(dpkg --print-architecture).deb"
          sudo dpkg -i nfpm.deb
          mkdir -p dist
          export VERSION=${{ steps.version.outputs.version }}
          ARCH=${{ matrix.deb }} nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          ARCH=${{ matrix.arch }} nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  linux-install:
    # Fresh containers of the distributions the packages are for, with
    # gptpd's own package of the same kind put in first.
    name: linux-install (${{ matrix.image }}, ${{ matrix.arch }})
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image: ['debian:13', 'ubuntu:24.04', 'ubuntu:26.04', 'fedora:44']
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: packages
      - name: gptpd's package
        run: |
          case $IMAGE in
          fedora:*) pattern="gptpd-*.${ARCH}.rpm" ;;
          *) pattern="gptpd_*_$([ "$ARCH" = x86_64 ] && echo amd64 || echo arm64).deb" ;;
          esac
          gh release download "$GPTPD_TAG" --repo scrambletools/gptp --pattern "$pattern" --dir first
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
      - name: Install, run and remove
        run: |
          case $IMAGE in
          fedora:*) package=$(ls packages/*.rpm) ;;
          *) package=$(ls packages/*.deb) ;;
          esac
          packaging/tests/run.sh "$IMAGE" "$package" first/*
        env:
          IMAGE: ${{ matrix.image }}

  arch-install:
    # The PKGBUILD, built from this tree in a fresh Arch container as
    # someone building it would, and its package tested like the others.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the package
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/avb-endpointd/PKGBUILD)
          git archive --prefix="Linux-AVB-Endpoint-avb-endpointd-v$pkgver/" \
            -o "Linux-AVB-Endpoint-$pkgver.tar.gz" HEAD
          docker run --rm -v "$PWD:/work" -w /work archlinux:latest \
            packaging/tests/build-arch.sh "Linux-AVB-Endpoint-$pkgver.tar.gz" dist-arch
      - name: Install, run and remove
        run: packaging/tests/run.sh archlinux:latest dist-arch/avb-endpointd-[0-9]*.pkg.tar.zst

  pkgbuild:
    # The release's PKGBUILD builds from GitHub's source archive of the
    # tag; its checksum is only known once the tag exists.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: PKGBUILD with the source checksum
        run: |
          curl -sSLf -o source.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sum=$(sha256sum source.tar.gz | cut -d' ' -f1)
          mkdir -p pkgbuild
          sed "s/^sha256sums=('SKIP')/sha256sums=('$sum')/" \
            packaging/arch/avb-endpointd/PKGBUILD >pkgbuild/PKGBUILD
          cp packaging/arch/avb-endpointd/avb-endpointd.install pkgbuild/
      - uses: actions/upload-artifact@v4
        with:
          name: pkgbuild
          path: pkgbuild/*

  release:
    if: github.ref_type == 'tag'
    needs: [linux, linux-install, arch-install, pkgbuild]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and notes
        run: |
          mkdir -p upload
          cp artifacts/linux-*/* artifacts/pkgbuild/* upload/
          (cd upload && sha256sum * >SHA256SUMS)
          version=${GITHUB_REF_NAME#avb-endpointd-v}
          # This version's section of the changelog, without its heading.
          touch notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v version="$version" '
              /^## / { found = index($0, "[" version "]") > 0; next }
              found' CHANGELOG.md >notes.md
          fi
      - name: Draft the release
        run: |
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" upload/* \
            --draft --title "avb-endpointd ${GITHUB_REF_NAME#avb-endpointd-v}" "${notes[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
